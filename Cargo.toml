[package]
name = "studyflow-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
pdf-extract = "0.12.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9.5.1"

[profile.release]
opt-level = 3
lto = true
strip = true
