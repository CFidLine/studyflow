name: Build StudyFlow
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            bin: studyflow-rust.exe
          - os: macos-latest
            name: macOS
            bin: studyflow-rust
          - os: ubuntu-latest
            name: Linux
            bin: studyflow-rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
